name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
      - multi
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

permissions:
  contents: write
  pull-requests: write
  statuses: write

# Allow only one concurrent deployment per branch/PR
concurrency:
  group: pages-${{ github.ref }}-${{ github.event.pull_request.number || 'no-pr' }}
  cancel-in-progress: false

jobs:
  # Build and deploy job (not for PR closures)
  deploy:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run render

      - name: Determine deployment path and URL
        id: determine-path
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "path=." >> $GITHUB_OUTPUT
            echo "url=https://${{ github.repository_owner }}.github.io/DIIP" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "path=draft" >> $GITHUB_OUTPUT
            echo "url=https://${{ github.repository_owner }}.github.io/DIIP/draft" >> $GITHUB_OUTPUT
            echo "branch=develop" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/multi" ]]; then
            echo "path=draft" >> $GITHUB_OUTPUT
            echo "url=https://${{ github.repository_owner }}.github.io/DIIP/draft" >> $GITHUB_OUTPUT
            echo "branch=multi" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            echo "path=pr/pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
            echo "url=https://${{ github.repository_owner }}.github.io/DIIP/pr/pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
            echo "branch=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Initialize gh-pages if it doesn't exist
        run: |
          if [ ! -d "gh-pages" ]; then
            mkdir gh-pages
            cd gh-pages
            git init
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git checkout --orphan gh-pages
            echo "# GitHub Pages for DIIP" > README.md
            echo "" >> README.md
            echo "This branch contains the deployed GitHub Pages content for the Decentralized Identity Interop Profile (DIIP)." >> README.md
            echo "" >> README.md
            echo "## Setup" >> README.md
            echo "To enable GitHub Pages for this repository:" >> README.md
            echo "1. Go to repository Settings > Pages" >> README.md
            echo "2. Under 'Source', select 'Deploy from a branch'" >> README.md
            echo "3. Select branch 'gh-pages' and folder '/ (root)'" >> README.md
            echo "4. Click 'Save'" >> README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Initialize gh-pages branch with setup instructions"
            git push origin gh-pages
            echo "Created gh-pages branch with setup instructions"
          fi

      - name: Deploy to target directory
        run: |
          DEPLOY_PATH="${{ steps.determine-path.outputs.path }}"
          cd gh-pages
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Create/update the target directory
          if [[ "$DEPLOY_PATH" == "." ]]; then
            # For main branch, update root files but preserve subdirectories
            find . -maxdepth 1 -name "*.html" -delete 2>/dev/null || true
            find . -maxdepth 1 -name "*.png" -delete 2>/dev/null || true
            find . -maxdepth 1 -name "*.js" -delete 2>/dev/null || true
            rm -rf ./assets ./custom-assets 2>/dev/null || true
          
            # Copy new files
            cp ../*.html . 2>/dev/null || true
            cp ../*.png . 2>/dev/null || true  
            cp ../*.js . 2>/dev/null || true
            cp -r ../assets . 2>/dev/null || true
            cp -r ../custom-assets . 2>/dev/null || true
          
            # Also create/update latest directory
            rm -rf latest
            mkdir -p latest
            cp ../*.html ./latest/ 2>/dev/null || true
            cp ../*.png ./latest/ 2>/dev/null || true
            cp ../*.js ./latest/ 2>/dev/null || true
            cp -r ../assets ./latest/ 2>/dev/null || true
            cp -r ../custom-assets ./latest/ 2>/dev/null || true
          else
            # For develop/PR branches, update specific subdirectory
            rm -rf "$DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH"
            cp ../*.html "./$DEPLOY_PATH/" 2>/dev/null || true
            cp ../*.png "./$DEPLOY_PATH/" 2>/dev/null || true
            cp ../*.js "./$DEPLOY_PATH/" 2>/dev/null || true
            cp -r ../assets "./$DEPLOY_PATH/" 2>/dev/null || true
            cp -r ../custom-assets "./$DEPLOY_PATH/" 2>/dev/null || true
          fi
          
          # Commit and push changes
          git add .
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            BRANCH_NAME="${{ steps.determine-path.outputs.branch }}"
            git commit -m "Deploy $BRANCH_NAME to $DEPLOY_PATH"
            git push origin gh-pages
            echo "Successfully deployed to $DEPLOY_PATH"
            echo "Will be available at: ${{ steps.determine-path.outputs.url }}"
          fi

      - name: Check GitHub Pages status and provide setup instructions
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.determine-path.outputs.url }}';
            const path = '${{ steps.determine-path.outputs.path }}';
            
            try {
              // Try to get pages info to see if it's enabled
              const pages = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            
              console.log(`GitHub Pages is enabled and configured`);
              console.log(`Site URL: ${pages.data.html_url}`);
              console.log(`Deployment URL: ${deployUrl}`);
            
            } catch (error) {
              if (error.status === 404) {
                console.log('GitHub Pages is not enabled for this repository.');
                console.log('');
                console.log('To enable GitHub Pages:');
                console.log('   1. Go to repository Settings > Pages');
                console.log('   2. Under "Source", select "Deploy from a branch"');
                console.log('   3. Select branch "gh-pages" and folder "/ (root)"');
                console.log('   4. Click "Save"');
                console.log('');
                console.log(`After setup, your site will be available at: ${deployUrl}`);
            
                // Create a summary for the workflow
                await core.summary
                  .addHeading('GitHub Pages Setup Required')
                  .addRaw('GitHub Pages is not enabled for this repository. ')
                  .addRaw('The content has been deployed to the gh-pages branch, but you need to enable Pages manually.')
                  .addHeading('Setup Instructions')
                  .addList([
                    'Go to repository **Settings > Pages**',
                    'Under **Source**, select **Deploy from a branch**', 
                    'Select branch **gh-pages** and folder **/ (root)**',
                    'Click **Save**'
                  ])
                  .addRaw(`After setup, your site will be available at: **${deployUrl}**`)
                  .write();
            
              } else {
                console.log('Error checking pages status:', error.message);
              }
            }

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.determine-path.outputs.url }}';
            const prNumber = context.payload.pull_request.number;
            
            const message = `🚀 **Preview deployment successful!**
            
            📄 **Preview URL:** ${deployUrl}
            📝 **PR:** #${prNumber}
            🔄 **Status:** Ready for review
            
            This preview will be updated automatically when you push new commits to this PR.
            
            > **Note:** If the preview URL shows a 404, ensure GitHub Pages is enabled in repository Settings > Pages with source set to 'gh-pages' branch.
            
            > The preview will be removed when the PR is closed or merged.`;
            
            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const existingComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('Preview deployment successful!')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: message
              });
            }

      - name: Create deployment status
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/multi')
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'success',
                description: 'Draft deployed successfully',
                target_url: '${{ steps.determine-path.outputs.url }}',
                context: 'github-pages/draft'
              });
              console.log('Commit status created successfully');
            } catch (error) {
              console.log('Could not create commit status:', error.message);
              console.log('This is not critical - deployment was successful');
            }

  # Cleanup job for closed PRs
  cleanup-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Remove PR directory
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_DIR="pr/pr-${PR_NUMBER}"
          
          if [ -d "$PR_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PR_DIR"
            git commit -m "Clean up preview for PR #${PR_NUMBER}" || exit 0
            git push origin gh-pages
            echo "Cleaned up preview directory: $PR_DIR"
          else
            echo "Preview directory $PR_DIR does not exist, nothing to clean up"
          fi

      - name: Comment on PR about cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🧹 **Preview cleaned up**
            
              The preview deployment for this PR has been removed since the PR was closed.
            
              Thank you for your contribution! 🎉`
            });